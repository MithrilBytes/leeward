# leeward example configuration. Copy to leeward.yaml.
# `leeward classify <url|tool>` will tell you which rule below decided a policy.

profile: dev                 # dev | production; chaos refuses to enable under production
data_dir: ./.leeward

surfaces:
  mcp:                       # point your MCP client at this
    enabled: true
    listen: 127.0.0.1:8787
    servers:
      notes:
        transport: stdio
        command: ["python", "-m", "fakes.mcp_server"]
      github:
        transport: http
        url: https://mcp.example.com/mcp
        headers_env:
          Authorization: GITHUB_MCP_AUTHORIZATION   # the variable's name, never its value
        accept_stale_argument: false                # true adds an optional accept_stale argument

  fetch:                     # point a tool's base URL at a mount
    enabled: true
    listen: 127.0.0.1:8787
    mounts:
      origin: http://127.0.0.1:8900        # demo fake
      wiki:   https://en.wikipedia.org
    generic_fetch:
      enabled: true                         # GET /fetch?url=<absolute>
      allow_hosts: ["en.wikipedia.org", "*.readthedocs.io"]

  forward:                   # HTTPS_PROXY=http://127.0.0.1:8788; tunnel only, no caching
    enabled: false
    listen: 127.0.0.1:8788

  llm:                       # base_url=http://127.0.0.1:8787/v1
    enabled: true
    listen: 127.0.0.1:8787
    tiers:
      - name: primary
        base_url: https://api.example.com/v1
        model: some-model
        api_key_env: LLM_API_KEY
      - name: local
        base_url: http://127.0.0.1:11434/v1
        model: granite3.3:8b
    status_line:
      enabled: false          # see `leeward status --show-injection`

defaults:
  class: volatile
  soft_deadline: 5s
  hard_deadline: 30s
  max_attempts: 2
  max_body_bytes: 10485760
  run_budget:
    max_retry_attempts_total: 20
    max_retry_seconds_total: 120
    max_endpoint_attempts: 4
  breaker:
    open_after_transient_failures: 3
    half_open_backoff_initial: 5s
    half_open_backoff_max: 120s
    close_after_successes: 2

# First match wins.
rules:
  - name: wikipedia-articles
    match: {url: "*/wiki/*"}
    class: static
    stale_on_error: 30d
    stale_while_revalidate: 1h

  - name: operator-status
    match: {url: "*/status*"}
    class: live               # never served stale, no exceptions
    stale_on_error: 0s
    hard_deadline: 10s

  - name: search-api
    match: {url: "*/search*"}
    class: volatile
    stale_on_error: 1h

  - name: docs-mirror
    match: {host: "*.readthedocs.io"}
    class: slow
    stale_on_error: 7d

  - name: notes-tools
    match: {tool: "notes/*"}
    class: volatile
    pure: true                # tool calls are cacheable only when pure
    stale_on_error: 6h

  - name: writes
    match: {method: "POST"}
    class: never              # not cached, not retried after bytes are sent
    idempotent: false

  - name: model-calls
    match: {tier: "*"}
    class: never
    soft_deadline: 20s
    hard_deadline: 120s

corpora:
  - name: blackout-refs
    type: url_list
    urls_file: demo/fixtures/wiki_urls.txt
    warm_on_degradation: true
    max_bytes: 200MB
    concurrency: 2
    rps: 5

  - name: docs
    type: sitemap
    url: https://example.readthedocs.io/sitemap.xml
    respect_robots: true
    schedule: "0 3 * * *"

  - name: wikipedia-offline
    type: zim
    kiwix_url: http://127.0.0.1:8080
    maps_host: en.wikipedia.org

redaction:
  headers: [authorization, x-api-key, cookie, proxy-authorization]

clock:
  skew_threshold: 5m

chaos:
  enabled: true
